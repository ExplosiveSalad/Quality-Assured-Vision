name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore EmbeddedCV.QA/EmbeddedCV.Tests/EmbeddedCV.Tests.csproj

      - name: Build
        run: dotnet build EmbeddedCV.QA/EmbeddedCV.Tests/EmbeddedCV.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test EmbeddedCV.QA/EmbeddedCV.Tests/EmbeddedCV.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'